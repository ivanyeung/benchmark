; ============================================================================
; fairness_configs.ini — SHARED-cgroup benchmark, 3-PHASE EVICTION CHOREOGRAPHY
; ============================================================================
;
; Run with --drop-once so the page cache is dropped ONLY before phase 0 and then
; PERSISTS across phases 1 and 2 — the whole point is that client2's reads
; accumulate and eventually evict client1's cached file.
;
; Run:
;   ./benchmark --drop-once -c fairness_configs.ini --cgroup-config cgroup_shared.ini \
;               -m cached -o results/shared_dual dual
;
; cgroup: client1_steady + client2_noisy are sibling leaves under a 2G-capped
; parent, no per-child memory limit (cgroup_shared.ini). Cache pool = 2G.
;
; NOTE (Docker Desktop host-cache masking): on Docker Desktop / any virtiofs bind
; mount, the file cache lives in the host VM OUTSIDE the cgroup, so the eviction
; (memory.current collapse + refault) is observable but client1's latency spike is
; MASKED (reads still served from host cache). Run on a real Linux host + real
; block device to see the phase-2 p99/p999 blow up. See benchmark-c-summary.md.
;
; ---------------------------------------------------------------------------
; THE STORY (each phase = runtime=30s, barrier-synced; both clients run every
; phase concurrently. client1 LOOPS its 1G for the whole phase (time_based);
; client2 runs the whole phase at a per-phase IOPS load that ramps up then down.)
; ---------------------------------------------------------------------------
;   PHASE 0  (cold): cache dropped at start. client1 loops its 1G (first lap warms
;            it, ~10s @ ~100 MiB/s). client2 is light (rate_iops=1024, ~4 MiB/s).
;            Pool (2G) holds client1's 1G + client2's trickle < 2G → NO eviction.
;            Expect client1 p99 = cache/cold-load latency, refault ~ 0.
;   PHASE 1  (contested): cache PERSISTS (--drop-once). client2 ramps HARD
;            (rate_iops=50000 x numjobs=4, iodepth=32 → ~700 MiB/s, ~20G streamed
;            over 30s) and evicts client1's 1G. Because client1 keeps LOOPING, each
;            lap after an eviction re-reads evicted pages → refault RISES. Expect
;            client1 tail latency (p99.9/p99.99) to spike under contention.
;   PHASE 2  (evicted victim): client2 backs off (rate_iops=1024). client1's pages
;            were taken in phase 1, so its laps now MISS → served from disk, and
;            re-reads of evicted+shadowed pages count as refaults. Expect the
;            largest refault delta here; misses resolve faster than phase 1 since
;            client2 no longer competes for the device.
;
; Knobs actually used here (see benchmark-c-summary.md):
;   time_based  client1 sets NO io_size → build_fio_cmd() emits `--time_based` and
;               fio loops the --size region for the full runtime. Looping (not a
;               single pass) is what makes evict-then-reread → refault observable.
;   rate_iops   fio --rate_iops: per-job IOPS cap. client2's ramp (1024 → 50000x4
;               → 1024) is what streams pages through the pool and drives eviction.

; ----------------------------------------------------------------------------
; Tenant A — client1 (victim). Each phase: LOOP (time_based, no io_size) with
; RANDREAD + zipf so a HOT SUBSET of the 1G is re-referenced repeatedly.
;
; Why randread+zipf and not sequential read: a sequential streaming scan is
; treated by the kernel as "use-once" — pages stay on the inactive LRU and never
; build a retained, cgroup-charged working set (we saw memory.current hold only
; ~130 MiB after a looping sequential warm-up despite 98% hits). Random
; re-reference PROMOTES hot pages to the ACTIVE list, so they become a real
; resident set charged to client1 — which client2 can then evict, and which
; client1's next lap re-reads => workingset_refault fires.
;
; HOT-SET SIZING (zoned_abs): zipf gave an implicit ~50 MiB hot set that fit in
; any pool >= 50 MiB, so it never missed regardless of memory.max. To make the
; cap bite we pin an EXPLICIT hot set with zoned_abs:
;   zoned_abs:90/200M:10/824M  = 90% of accesses land in the first 200 MiB
;   (the working set), 10% in the remaining 824 MiB (the cold tail).
; The 200 MiB is now the actively-referenced footprint. It only MISSES when
; client1 can't retain it, i.e. hot_set (200M) > cache client1 keeps
; (~pool - client2's share). So pair this with a TIGHT pool (memory.max ~512M in
; cgroup_shared.ini): 200M can't coexist with client2's flood in 512M -> the
; overflow is evicted and refaulted every loop. In a 2G pool 200M fits -> all
; hits. Grow the 200M (or shrink the pool) until misses appear.
; iodepth=1 keeps it a latency-sensitive victim. IDENTICAL across all 3 phases;
; only the cache STATE (set by client2) differs.
; NOTE: no phase_*_io_size here -> build_fio_cmd() takes the `--time_based` branch
; and fio loops the --size region for the whole runtime. Keep runtime aligned
; with client2's runtime so both tenants compete for the same window.
; ----------------------------------------------------------------------------
[client1_steady]
description = Victim: loop randread a 200M zoned_abs hot set (time_based) to expose refaults
file_size = 1G

phase_0_pattern = randread
phase_0_block_size = 4k
phase_0_rate_iops = 50000
phase_0_iodepth = 1
phase_0_numjobs = 1
phase_0_runtime = 30
phase_0_ioengine = libaio
phase_0_random_distribution = zoned_abs:90/200M:10/824M

phase_1_pattern = randread
phase_1_block_size = 4k
phase_1_rate_iops = 50000
phase_1_iodepth = 1
phase_1_numjobs = 1
phase_1_runtime = 30
phase_1_ioengine = libaio
phase_1_random_distribution = zoned_abs:90/200M:10/824M

phase_2_pattern = randread
phase_2_block_size = 4k
phase_2_rate_iops = 50000
phase_2_iodepth = 1
phase_2_numjobs = 1
phase_2_runtime = 30
phase_2_ioengine = libaio
phase_2_random_distribution = zoned_abs:90/200M:10/824M

; ----------------------------------------------------------------------------
; ISOLATED client2 — same aggressor ramp as the shared run, no victim present.
; ----------------------------------------------------------------------------
[client2_noisy]
description = Isolated aggressor baseline: stream 8G, ramp bandwidth 8m -> 100m -> unlimited
file_size = 8G

phase_0_pattern = read
phase_0_block_size = 4k
phase_0_rate_iops = 1024
phase_0_iodepth = 1
phase_0_numjobs = 1
phase_0_runtime = 30
phase_0_ioengine = libaio

phase_1_pattern = read
phase_1_block_size = 4k
phase_1_rate_iops = 50000
phase_1_iodepth = 32
phase_1_numjobs = 4
phase_1_runtime = 30
phase_1_ioengine = libaio

phase_2_pattern = read
phase_2_block_size = 4k
phase_2_rate_iops = 1024
phase_2_iodepth = 1
phase_2_numjobs = 1
phase_2_runtime = 30
phase_2_ioengine = libaio
