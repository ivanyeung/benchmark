; ============================================================================
; fairness_configs.ini — SHARED-cgroup benchmark, 3-PHASE EVICTION CHOREOGRAPHY
; ============================================================================
;
; Run with --drop-once so the page cache is dropped ONLY before phase 0 and then
; PERSISTS across phases 1 and 2 — the whole point is that client2's reads
; accumulate and eventually evict client1's cached file.
;
; Run:
;   ./benchmark --drop-once -c fairness_configs.ini --cgroup-config cgroup_shared.ini \
;               -m cached -o results/shared_dual dual
;
; cgroup: client1_steady + client2_noisy are sibling leaves under a 2G-capped
; parent, no per-child memory limit (cgroup_shared.ini). Cache pool = 2G.
;
; NOTE (Docker Desktop host-cache masking): on Docker Desktop / any virtiofs bind
; mount, the file cache lives in the host VM OUTSIDE the cgroup, so the eviction
; (memory.current collapse + refault) is observable but client1's latency spike is
; MASKED (reads still served from host cache). Run on a real Linux host + real
; block device to see the phase-2 p99/p999 blow up. See benchmark-c-summary.md.
;
; ---------------------------------------------------------------------------
; THE STORY (each phase = 60s; client1 reads its 1G once at phase start then idles;
; client2 runs the whole 60s at a per-phase bandwidth that ramps up)
; ---------------------------------------------------------------------------
;   PHASE 0  (cold): client1 loads its 1G into cache (~10s @ 100 MiB/s) then idles.
;            client2 reads only ~480MB (rate=8m). Pool holds ~1.5G < 2G → NO
;            eviction. Expect client1 p99 = cold-load latency, refault = 0.
;   PHASE 1  (cache-hit): client1 REREADS its 1G — still cached, so it hits cache
;            (fast) before client2 evicts. client2 cranks to 100 MiB/s (~6G streamed
;            over 60s) and by end of the phase overflows the 2G pool. Expect client1
;            p99 = cache latency (low), refault ~ 0.
;   PHASE 2  (evicted): client2 bursts unlimited and has evicted client1's pages, so
;            client1's reread now MISSES → served from disk. Expect client1 p99 =
;            disk latency (high), refault = high.
;
; NEW knobs used here (see benchmark-c-summary.md):
;   io_size  fio --io_size: read exactly this much then STOP (not time_based).
;            Used by client1 to "read its 1G file once then suspend" each phase.
;   rate_bw  fio --rate: bandwidth cap (e.g. 100m = 100 MiB/s). Bandwidth — not
;            IOPS — is what streams pages through the pool and drives eviction.

; ----------------------------------------------------------------------------
; Tenant A — client1 (victim). Each phase: sequentially read its whole 1G file
; ONCE at 100 MiB/s (~10s) then idle. IDENTICAL across all 3 phases; only the
; cache STATE (set by client2) differs between phases. Record p99/p999/refault.
; ----------------------------------------------------------------------------
[client1_steady]
description = Victim: read 1G file once/phase (io_size=1G @ 100 MiB/s) then idle; record clat p99/p999 + refault
file_size = 1G

; --- phase 0 (annotated; phases 1-2 identical) ---
phase_0_pattern = read        ; fio --rw: sequential read (loads the whole file)
phase_0_block_size = 64k      ; fio --bs: 64 KiB per I/O
phase_0_io_size = 1G          ; fio --io_size: read exactly 1G once, then stop
phase_0_rate_bw = 100m        ; fio --rate: 100 MiB/s → 1G takes ~10s
phase_0_iodepth = 1           ; fio --iodepth: one in-flight I/O = clean latency
phase_0_numjobs = 1
phase_0_runtime = 60          ; ceiling only (io_size set → not time_based)
phase_0_ioengine = libaio

; --- phase 1 (identical to phase 0) ---
phase_1_pattern = read
phase_1_block_size = 64k
phase_1_io_size = 1G
phase_1_rate_bw = 100m
phase_1_iodepth = 1
phase_1_numjobs = 1
phase_1_runtime = 60
phase_1_ioengine = libaio

; --- phase 2 (identical to phase 0) ---
phase_2_pattern = read
phase_2_block_size = 64k
phase_2_io_size = 1G
phase_2_rate_bw = 100m
phase_2_iodepth = 1
phase_2_numjobs = 1
phase_2_runtime = 60
phase_2_ioengine = libaio

; ----------------------------------------------------------------------------
; Tenant B — client2 (aggressor). Streams its 8G file for the full 60s each
; phase, RAMPING bandwidth across phases to drive the eviction story above.
;   phase 0: rate=8m   → ~480MB read  (pool stays ~1.5G, no eviction)
;   phase 1: rate=100m → ~6GB read    (overflows the 2G pool, evicts by end)
;   phase 2: unlimited → burst        (evicts everything, client1 forced to disk)
; ----------------------------------------------------------------------------
[client2_noisy]
description = Aggressor: stream 8G file, ramp bandwidth 8m -> 100m -> unlimited to evict client1
file_size = 8G

; --- phase 0: light (reads < 500MB) ---
phase_0_pattern = read        ; sequential stream
phase_0_block_size = 1M       ; big blocks = high bandwidth per I/O
phase_0_rate_bw = 8m          ; 8 MiB/s × 60s ≈ 480 MB (< 500MB)
phase_0_iodepth = 32
phase_0_numjobs = 1
phase_0_runtime = 60          ; time_based (no io_size) → runs the full 60s
phase_0_ioengine = libaio

; --- phase 1: crank up (fills + overflows the 2G pool) ---
phase_1_pattern = read
phase_1_block_size = 1M
phase_1_rate_bw = 100m        ; 100 MiB/s × 60s ≈ 6GB → overflows pool
phase_1_iodepth = 32
phase_1_numjobs = 1
phase_1_runtime = 60
phase_1_ioengine = libaio

; --- phase 2: burst (unlimited; no rate_bw) → evicts everything ---
phase_2_pattern = read
phase_2_block_size = 1M
phase_2_iodepth = 32
phase_2_numjobs = 1
phase_2_runtime = 60
phase_2_ioengine = libaio
