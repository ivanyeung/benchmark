; ============================================================================
; fairness_isolated.ini — ISOLATED baselines (each client runs ALONE, 3 phases)
; ============================================================================
;
; Run each section on its own (single mode), also with --drop-once so the cache
; persists across phases — but with no neighbour there is nothing to evict, so
; these are the "best case" baselines the shared 3-phase run is compared against.
;
;   ./benchmark --drop-once -c fairness_isolated.ini --cgroup-config cgroup_isolated.ini \
;               -m cached -o results/isolated_client1 client1_steady
;   ./benchmark --drop-once -c fairness_isolated.ini --cgroup-config cgroup_isolated.ini \
;               -m cached -o results/isolated_client2 client2_noisy
;
; client1 alone: phase 0 = cold load (disk), phases 1-2 = reread from cache (fast,
;   no eviction because there is no aggressor). client2 alone: its own streaming
;   throughput/latency with the whole 2G pool to itself.
;
; Parameters are identical to the shared benchmark (fairness_configs.ini); see
; that file / benchmark-c-summary.md for what io_size and rate_bw do.
;
; NOTE (Docker Desktop host-cache masking): on Docker Desktop / virtiofs bind
; mounts the file cache lives in the host VM outside the cgroup, so latency spikes
; are masked (reads served from host cache). Run on a real Linux host + block
; device for trustworthy latency numbers. See benchmark-c-summary.md.
; ============================================================================

; ----------------------------------------------------------------------------
; ISOLATED client1 — same victim workload as the shared run, no neighbour.
; ----------------------------------------------------------------------------
[client1_steady]
description = Isolated victim baseline: read 1G once/phase then idle (no aggressor)
file_size = 1G

phase_0_pattern = read
phase_0_block_size = 64k
phase_0_io_size = 1G
phase_0_rate_bw = 100m
phase_0_iodepth = 1
phase_0_numjobs = 1
phase_0_runtime = 60
phase_0_ioengine = libaio

phase_1_pattern = read
phase_1_block_size = 64k
phase_1_io_size = 1G
phase_1_rate_bw = 100m
phase_1_iodepth = 1
phase_1_numjobs = 1
phase_1_runtime = 60
phase_1_ioengine = libaio

phase_2_pattern = read
phase_2_block_size = 64k
phase_2_io_size = 1G
phase_2_rate_bw = 100m
phase_2_iodepth = 1
phase_2_numjobs = 1
phase_2_runtime = 60
phase_2_ioengine = libaio

; ----------------------------------------------------------------------------
; ISOLATED client2 — same aggressor ramp as the shared run, no victim present.
; ----------------------------------------------------------------------------
[client2_noisy]
description = Isolated aggressor baseline: stream 8G, ramp bandwidth 8m -> 100m -> unlimited
file_size = 8G

phase_0_pattern = read
phase_0_block_size = 1M
phase_0_rate_bw = 8m
phase_0_iodepth = 32
phase_0_numjobs = 1
phase_0_runtime = 60
phase_0_ioengine = libaio

phase_1_pattern = read
phase_1_block_size = 1M
phase_1_rate_bw = 100m
phase_1_iodepth = 32
phase_1_numjobs = 1
phase_1_runtime = 60
phase_1_ioengine = libaio

phase_2_pattern = read
phase_2_block_size = 1M
phase_2_iodepth = 32
phase_2_numjobs = 1
phase_2_runtime = 60
phase_2_ioengine = libaio
