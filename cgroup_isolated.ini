; ============================================================================
; cgroup_isolated.ini — cgroup layout for the ISOLATED benchmark (client alone).
; ============================================================================
;
; WHAT THIS LAYOUT DOES
;   Identical tree to cgroup_shared.ini: ONE parent capped at 2G with two sibling
;   child leaves that carry NO memory limit. It is used for the isolated tests,
;   where only ONE client runs at a time — so that client effectively has the
;   whole 2G pool to itself (no neighbour evicting its pages). These runs give
;   the baseline p99 the shared (contended) results are compared against.
;
;       /sys/fs/cgroup/clients                 <- parent, memory.max = 2G
;         ├── clients/client1_steady           <- child leaf, no memory limit
;         └── clients/client2_noisy            <- child leaf, no memory limit
;
;   (The "isolated" here means the client runs in isolation from a neighbour, not
;    that the cgroup layout differs from the shared one — the layouts are the
;    same; only the number of clients running at once differs.)
;
; HOW IT IS USED
;   Passed with --cgroup-config; the harness creates each cgroup, applies the
;   limits below, and moves the (single) running client's fio into its leaf.
;
; PARAMETER GLOSSARY (keys map to cgroup v2 control files)
;   [section]    a cgroup; the name MUST match a workload section (client1_steady
;                / client2_noisy). [clients] is the shared parent (not a client).
;   cgroup_name  path of the cgroup under /sys/fs/cgroup (slashes = nesting).
;   memory.max   hard memory ceiling. Set ONLY on the parent (2G).
;   memory.low   soft protected reserve. NOT set — no per-tenant protection.
;   io.weight    proportional block-I/O share (1..10000); 100 = equal.
; ============================================================================

; ---- parent: the 2G pool (a lone client gets all of it) ----
[clients]
cgroup_name = clients
memory.max = 2G               ; hard 2G cap on the pool

; ---- client1 leaf: no memory limit; equal I/O weight ----
[client1_steady]
cgroup_name = clients/client1_steady
io.weight = 100               ; equal I/O share (no memory.low/max set)

; ---- client2 leaf: no memory limit; equal I/O weight ----
[client2_noisy]
cgroup_name = clients/client2_noisy
io.weight = 100               ; equal I/O share (no memory.low/max set)
