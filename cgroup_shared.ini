; ============================================================================
; cgroup_shared.ini — cgroup layout for the SHARED benchmark (both clients).
; ============================================================================
;
; WHAT THIS LAYOUT DOES
;   Defines a cgroup v2 tree with ONE parent capped at 2G of memory and two
;   sibling child cgroups (one per client) that carry NO memory limit of their
;   own. Both clients therefore compete for the SAME 2G page-cache pool: whoever
;   the kernel's LRU/reclaim picks loses its cached pages. There is no per-tenant
;   protection, which is exactly the (un)fairness the benchmark measures.
;
;       /sys/fs/cgroup/clients                 <- parent, memory.max = 2G
;         ├── clients/client1_steady           <- child leaf, no memory limit
;         └── clients/client2_noisy            <- child leaf, no memory limit
;
; HOW IT IS USED
;   Passed with --cgroup-config; the harness creates each cgroup, applies the
;   limits below, and moves each client's fio process into its leaf so the
;   client runs under these constraints.
;
; PARAMETER GLOSSARY (keys map to cgroup v2 control files)
;   [section]    a cgroup; the name MUST match a workload section (client1_steady
;                / client2_noisy) so the harness can place that client here.
;                [clients] is the shared parent (not a client).
;   cgroup_name  path of the cgroup under /sys/fs/cgroup (slashes = nesting).
;   memory.max   hard memory ceiling for the cgroup (usage above it triggers
;                reclaim). Set ONLY on the parent (2G) — the shared pool.
;   memory.low   soft protected reserve (reclaimed last). NOT set here — no child
;                is protected (that is the point of the shared/no-protection case).
;   io.weight    proportional block-I/O share under contention (1..10000). Both
;                children get 100 (equal) so I/O weighting is not a confounder.
; ============================================================================

; ---- parent: the shared 2G page-cache pool both clients live under ----
[clients]
cgroup_name = clients
memory.max = 2G               ; hard 2G cap on the shared pool (the scarce resource)

; ---- client1 leaf: no memory limit; equal I/O weight ----
[client1_steady]
cgroup_name = clients/client1_steady
io.weight = 100               ; equal I/O share (no memory.low/max = no protection)

; ---- client2 leaf: no memory limit; equal I/O weight ----
[client2_noisy]
cgroup_name = clients/client2_noisy
io.weight = 100               ; equal I/O share (no memory.low/max = no protection)
